<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Hackoween — Engineering</title>
<style>
:root { color-scheme: dark; --ink: #fff; --bg: #000; --dim: #bdbdbd; --mute: #8a8a8a; --line: #3a3a3a;
        --pump: #ff8b00; --pump2: #ff9218; --ok: #9be7b0; --bad: #ff6b5a; font-family: "Courier New", Courier, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
button { font: inherit; }
.viewport { height: 100vh; display: flex; align-items: center; justify-content: center; }
.stage-wrap { position: relative; flex: none; width: 1600px; height: 900px; }
.stage { position: absolute; width: 1600px; height: 900px; transform-origin: top left; background: var(--bg); overflow: hidden; }
.frame { position: absolute; border: 4px solid var(--ink); border-radius: 16px; background: var(--bg);
         box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 5px #6a6a6a; }
.head { position: absolute; left: 18px; top: 12px; right: 18px; display: flex; align-items: center; gap: 12px;
        font-size: 20px; font-weight: bold; letter-spacing: 2px; }
.head img { width: 40px; height: 36px; object-fit: contain; }
.head { white-space: nowrap; }
.head small { margin-left: auto; color: var(--mute); font-size: 12px; font-weight: normal; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; }
.rule { position: absolute; left: 18px; right: 18px; top: 56px; border-top: 3px solid var(--ink); }
.header { left: 8px; top: 4px; width: 1584px; height: 100px; display: block; }
.header .logo { position: absolute; left: 47px; top: 2px; height: 88px; }
.header .title { position: absolute; left: 160px; top: 2px; height: 90px; }
.navbtn { position: absolute; top: 24px; height: 50px; padding: 0 16px; border: 3px solid var(--ink); border-radius: 10px; background: var(--bg);
          color: var(--ink); font-weight: bold; font-size: 17px; letter-spacing: 1px; cursor: pointer; text-decoration: none; display: flex; align-items: center; z-index: 2; }
.navbtn:hover { border-color: var(--pump); color: var(--pump); }
.kick { position: absolute; left: 1290px; top: 78px; color: var(--pump2); font-size: 14px; letter-spacing: 3px; z-index: 2; }
.p-map { left: 8px; top: 116px; width: 640px; height: 776px; }
#map { position: absolute; left: 22px; top: 72px; width: 588px; height: 588px; border: 2px solid var(--line); border-radius: 8px; background: #000; }
.legend { position: absolute; left: 22px; right: 22px; top: 672px; display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 2px solid var(--line); border-radius: 7px; white-space: nowrap; }
.chip i { width: 12px; height: 12px; border: 1px solid #777; display: inline-block; }
.chip.toggle { cursor: pointer; border-color: var(--ink); }
.chip.toggle.on { background: var(--ink); color: var(--bg); }
.p-cov { left: 660px; top: 116px; width: 440px; height: 236px; }
.bignum { position: absolute; left: 22px; top: 70px; font-size: 64px; font-weight: bold; letter-spacing: 2px; line-height: 1; }
.bignum small { font-size: 16px; letter-spacing: 1px; color: var(--dim); font-weight: normal; }
.gt { position: absolute; right: 22px; top: 72px; text-align: right; font-size: 13px; color: var(--dim); line-height: 1.5; }
.gt b { display: block; color: var(--ok); font-size: 26px; }
.bar { position: absolute; left: 22px; right: 22px; top: 158px; height: 26px; display: grid; grid-template-columns: repeat(25, 1fr); gap: 4px; }
.bar span { border: 2px solid var(--line); background: #000; }
.bar span.on { background: var(--ink); border-color: var(--ink); }
.bar span.real { box-shadow: inset 0 -6px 0 var(--ok); border-color: var(--ok); }
.barcap { position: absolute; left: 22px; right: 22px; top: 194px; display: flex; justify-content: space-between; color: var(--mute); font-size: 12px; }
.p-stats { left: 660px; top: 362px; width: 440px; height: 278px; }
.grid2 { position: absolute; left: 22px; right: 22px; top: 70px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.tile b { display: block; font-size: 21px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { color: var(--mute); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.tile.warn b { color: var(--pump); }
.p-stats .grid2 { top: 66px; gap: 5px; }
.p-stats .tile { padding: 2px 10px; }
.p-stats .tile b { font-size: 16px; line-height: 1.25; }
.p-stats .tile span { font-size: 10px; }
.p-route { left: 660px; top: 650px; width: 440px; height: 242px; }
.routebig { position: absolute; left: 22px; top: 68px; right: 22px; display: flex; gap: 10px; align-items: baseline; }
.routebig b { font-size: 34px; }
.routebig .algo { margin-left: auto; padding: 3px 10px; border: 2px solid var(--pump); color: var(--pump); border-radius: 7px; font-weight: bold; font-size: 15px; }
.kv { position: absolute; left: 22px; right: 22px; top: 118px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 13px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed #333; padding: 3px 0; white-space: nowrap; }
.kv span { color: var(--mute); }
.p-robot { left: 1112px; top: 116px; width: 480px; height: 236px; }
.grid3 { position: absolute; left: 22px; right: 22px; top: 70px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.p-exec { left: 1112px; top: 362px; width: 480px; height: 278px; }
#exec { position: absolute; left: 18px; right: 18px; top: 66px; bottom: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; }
#exec div { flex: none; display: grid; grid-template-columns: 40px 62px 1fr; gap: 8px; padding: 3px 4px; border-bottom: 1px dashed #262626; white-space: nowrap; overflow: hidden; }
#exec div em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
#exec .t { color: var(--mute); } #exec .tool { color: var(--pump2); font-weight: bold; }
#exec .bump { background: rgba(255, 107, 90, .14); } #exec .bump .tool { color: var(--bad); }
.p-runs { left: 1112px; top: 650px; width: 480px; height: 242px; }
#runs { position: absolute; left: 18px; right: 18px; top: 66px; bottom: 14px; overflow: auto; font-size: 13px; }
#runs div { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px dashed #262626; }
#runs div em { font-style: normal; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { padding: 3px 8px; border: 2px solid var(--ink); border-radius: 7px; background: var(--bg); color: var(--ink); cursor: pointer; font-size: 12px; font-weight: bold; }
.btn:hover { border-color: var(--pump); color: var(--pump); }
.modal { position: absolute; z-index: 9; left: 300px; top: 150px; width: 1000px; height: 640px; }
.modal[hidden] { display: none; }
.modal video { position: absolute; left: 22px; top: 70px; width: 948px; height: 544px; background: #000; border: 2px solid var(--line); }
.pulse { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { opacity: 1; } 70% { opacity: .35; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>
<main class="viewport">
 <div class="stage-wrap" id="wrap">
  <section class="stage" id="stage">
   <a class="frame header" href="/" title="Title screen"><img class="logo" src="/dashboard/assets/logo-robot.png" alt="">
     <img class="title" src="/dashboard/assets/title.png" alt="Hackoween robotics simulation challenge, Claude Bot"></a>
   <a class="navbtn" style="left:1290px" href="/dashboard/console.html">◀ CONSOLE</a>
   <a class="navbtn" style="left:1460px" href="/">TITLE</a>

   <section class="frame p-map">
     <div class="head"><img src="/dashboard/assets/ico-free.png" alt="">ROBOT'S MAP<small>own camera + range scan only</small></div><div class="rule"></div>
     <canvas id="map" width="1176" height="1176"></canvas>
     <div class="legend" id="legend"></div>
   </section>

   <section class="frame p-cov">
     <div class="head">COVERAGE<small>robot's own estimate</small></div><div class="rule"></div>
     <div class="bignum" id="cov">–</div>
     <div class="gt">ground truth (operator only)<b id="gt">–</b><span id="gtm"></span></div>
     <div class="bar" id="bar"></div>
     <div class="barcap"><span>0 %</span><span>white: robot's estimate · green: real</span><span>100 %</span></div>
   </section>

   <section class="frame p-stats">
     <div class="head">EXPLORATION<small>this map</small></div><div class="rule"></div>
     <div class="grid2" id="stats"></div>
   </section>

   <section class="frame p-route">
     <div class="head">ROUTE<small id="routesub">planned path</small></div><div class="rule"></div>
     <div class="routebig"><b id="rlen">–</b><span id="rtime" style="color:var(--dim)"></span><span class="algo" id="ralgo">–</span></div>
     <div class="kv" id="route"></div>
   </section>

   <section class="frame p-robot">
     <div class="head"><img src="/dashboard/assets/logo-robot.png" alt="">ROBOT<small id="state">–</small></div><div class="rule"></div>
     <div class="grid3" id="robot"></div>
   </section>

   <section class="frame p-exec">
     <div class="head"><img src="/dashboard/assets/ico-logs.png" alt="">EXECUTION<small>last actions</small></div><div class="rule"></div>
     <div id="exec"></div>
   </section>

   <section class="frame p-runs">
     <div class="head"><img src="/dashboard/assets/ico-runs.png" alt="">RUNS<small id="rundir"></small></div><div class="rule"></div>
     <div id="runs">loading…</div>
   </section>

   <section class="frame modal" id="modal" hidden>
     <div class="head"><span id="mtitle">VIDEO</span><small><button class="btn" id="mclose">✕ CLOSE</button></small></div><div class="rule"></div>
     <video id="player" controls></video>
   </section>
  </section>
 </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const stage = $("stage"), wrap = $("wrap");
function fit() { const s = Math.max(0.4, Math.min(innerWidth / 1600, innerHeight / 900));
  stage.style.transform = `scale(${s})`; wrap.style.width = `${1600 * s}px`; wrap.style.height = `${900 * s}px`; }
addEventListener("resize", fit); fit();

/* ---------- the robot's own map ---------- */
const COL = {u: "#000000", s: "#1c1c1c", f: "#474747", r: "#d8d8d8", h: "#2a1f3d", o: "#ffffff", i: "#4b2e10"};
const LEG = [["u", "unknown"], ["s", "free by range, not seen"], ["f", "seen by camera"], ["r", "seen just now"],
             ["h", "occluded"], ["o", "occupied"], ["i", "too close for the body"]];
let showCost = false;
$("legend").innerHTML = LEG.map(([k, n]) => `<span class="chip"><i style="background:${COL[k]}"></i>${n}</span>`).join("") +
  `<span class="chip"><i style="background:#cfcfcf;height:3px;border:0"></i>driven</span>` +
  `<span class="chip"><i style="background:#ff8b00;height:3px;border:0"></i>planned route</span>` +
  `<span class="chip toggle" id="costbtn"><i style="background:linear-gradient(90deg,#ff8b00,#000)"></i>Dijkstra time-to-reach</span>`;
$("costbtn").onclick = () => { showCost = !showCost; $("costbtn").classList.toggle("on", showCost); drawMap(); };
const CMAP = "0123456789abcdefghijklmnopqrstuvwxyz";
const VIEW = 3.4;
let S = null, M = null;
function line(g, pts, px, py) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(px(p[0]), py(p[1])) : g.moveTo(px(p[0]), py(p[1]))); g.stroke(); }
function drawMap() {
  const cv = $("map"), g = cv.getContext("2d"), W = cv.width;
  const px = x => (x + VIEW) / (2 * VIEW) * W, py = y => (VIEW - y) / (2 * VIEW) * W;
  g.fillStyle = "#000"; g.fillRect(0, 0, W, W);
  g.strokeStyle = "#141414"; g.lineWidth = 2;                       // 1 m grid
  for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(px(k), 0); g.lineTo(px(k), W); g.stroke();
    g.beginPath(); g.moveTo(0, py(k)); g.lineTo(W, py(k)); g.stroke(); }
  const m = M && M.map;
  if (m) {
    const n = m.n, c = m.cell, h = m.half, sz = c / (2 * VIEW) * W + 0.8;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const k = m.grid[j * n + i]; if (k === "u") continue;
      g.fillStyle = COL[k] || "#333"; g.fillRect(px(-h + i * c), py(-h + (j + 1) * c), sz, sz); }
    if (showCost && m.costmap) for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const ch = m.costmap[j * n + i]; if (ch === ".") continue; const v = CMAP.indexOf(ch) / (CMAP.length - 1);
      g.fillStyle = `rgba(255,139,0,${(0.8 * (1 - v)).toFixed(2)})`; g.fillRect(px(-h + i * c), py(-h + (j + 1) * c), sz, sz); }
    g.fillStyle = "#ff9218";
    for (const v of m.viewpoints || []) { g.beginPath(); g.arc(px(v[0]), py(v[1]), 6, 0, 7); g.fill(); }
    const pl = m.plan;
    if (pl && pl.prev_route) { g.strokeStyle = "#6b6b6b"; g.setLineDash([10, 10]); g.lineWidth = 3; line(g, pl.prev_route, px, py); g.setLineDash([]); }
    const trail = (S && S.trail) || [];
    if (trail.length > 1) { g.strokeStyle = "#cfcfcf"; g.lineWidth = 3; line(g, trail, px, py); }
    if (pl && pl.route) { g.strokeStyle = "#ff8b00"; g.setLineDash([18, 10]); g.lineWidth = 5; line(g, pl.route, px, py); g.setLineDash([]);
      g.beginPath(); g.arc(px(pl.x), py(pl.y), 18, 0, 7); g.stroke();
      if (pl.heading !== null && pl.heading !== undefined) { const a = pl.heading * Math.PI / 180;
        line(g, [[pl.x, pl.y], [pl.x + 0.5 * Math.cos(a), pl.y - 0.5 * Math.sin(a)]], px, py); } }
    g.font = "bold 26px Courier New, monospace";
    for (const [name, o] of Object.entries(m.objects || {})) {
      const tx = px(o.x) + 16, ty = py(o.y) - 12, w = g.measureText(name).width + 14;
      g.fillStyle = "rgba(0,0,0,.8)"; g.fillRect(tx - 7, ty - 25, w, 34); g.strokeStyle = "#fff"; g.lineWidth = 2; g.strokeRect(tx - 7, ty - 25, w, 34);
      g.fillStyle = "#fff"; g.fillText(name, tx, ty);
    }
  } else { g.fillStyle = "#bdbdbd"; g.font = "bold 34px Courier New"; g.fillText("no map yet: give the robot a task", 160, W / 2); }
  if (S) { const r = S.robot, a = r.heading * Math.PI / 180, fx = Math.cos(a), fy = -Math.sin(a);
    const cx = r.x + fx * .2, cy = r.y + fy * .2;
    g.fillStyle = "rgba(255,139,0,0.15)"; g.beginPath(); g.moveTo(px(cx), py(cy));
    for (let b = -45; b <= 45; b += 5) { const t = (r.heading + b) * Math.PI / 180; g.lineTo(px(cx + 4 * Math.cos(t)), py(cy - 4 * Math.sin(t))); }
    g.closePath(); g.fill();
    g.fillStyle = "#ff8b00"; g.strokeStyle = "#000"; g.lineWidth = 5; g.beginPath(); g.arc(px(r.x), py(r.y), 0.2 / (2 * VIEW) * W, 0, 7); g.fill(); g.stroke();
    g.lineWidth = 6; line(g, [[r.x, r.y], [r.x + fx * .3, r.y + fy * .3]], px, py); }
}

/* ---------- panels ---------- */
for (let k = 0; k < 25; k++) $("bar").insertAdjacentHTML("beforeend", "<span></span>");
const tile = (v, label, warn) => `<div class="tile${warn ? " warn" : ""}"><b>${v}</b><span>${label}</span></div>`;
const fmt = v => typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(2)) : esc(v);
function panels() {
  const m = M && M.map, gt = (M && M.gt) || {}, r = S && S.robot;
  if (m) {
    const st = m.stats, est = Math.round(st.coverage_est * 100), real = gt.coverage !== undefined ? Math.round(gt.coverage * 100) : null;
    $("cov").innerHTML = `${est}<small> % of ~${st.room_est_m2} m²</small>`;
    $("gt").textContent = real === null ? "–" : `${real} %`; $("gtm").textContent = gt.floor_m2 ? `of ${gt.floor_m2} m² real floor` : "";
    [...$("bar").children].forEach((s, k) => { s.classList.toggle("on", k < Math.round(est / 4)); s.classList.toggle("real", real !== null && k < Math.round(real / 4)); });
    $("stats").innerHTML = tile(`${st.new_last_m2} m²`, "new in last view") + tile(`${Math.round(st.redundant * 100)} %`, "redundant observation", st.redundant > .5) +
      tile(st.observations, "viewpoints") + tile(`${r ? r.path_length.toFixed(2) : "–"} m`, "distance travelled") +
      tile(`${st.turns} / ${st.wasted_turns}`, "turns / wasted", st.wasted_turns > 2) + tile(st.frontier_regions, "unexplored regions") +
      tile(`${(st.walls_seen || []).length} / 4`, "walls seen") + tile(m.plan && m.plan.gain_m2 !== undefined ? `+${m.plan.gain_m2} m²` : "–", "next view gain");
    const pl = m.plan, ps = pl && pl.stats;
    if (ps) {
      $("rlen").textContent = `${ps.length_m} m`; $("rtime").textContent = `≈ ${ps.time_s} s`; $("ralgo").textContent = String(ps.planner).toUpperCase();
      $("routesub").textContent = pl.replan ? `replanned ${pl.replan}×` : "planned path";
      $("route").innerHTML = [["cost", ps.cost], ["turns", ps.turns], ["curves", ps.arcs], ["states", ps.expanded], ["plan time", `${ps.plan_ms} ms`],
        ["goal", `(${pl.x.toFixed(2)}, ${pl.y.toFixed(2)})`], ["replans", pl.replan || 0], ["heading", pl.heading === null || pl.heading === undefined ? "any" : `${Math.round(pl.heading)}°`]]
        .map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("");
    } else { $("rlen").textContent = "–"; $("rtime").textContent = ""; $("ralgo").textContent = "–"; $("route").innerHTML = "<div><span>no route planned yet</span></div>"; }
  }
  if (r) {
    const busy = S.task && ["Starting", "Running"].includes(S.task.status);
    $("state").innerHTML = `<span class="${busy ? "pulse" : ""}" style="color:var(--pump2)">● ${esc(r.state)}</span>`;
    $("robot").innerHTML = tile(r.x.toFixed(2), "x m") + tile(r.y.toFixed(2), "y m") + tile(`${r.heading.toFixed(0)}°`, "heading") +
      tile(r.holding ? "yes" : "no", "holding") + tile(`${r.retries} / ${r.collisions}`, "retries / bumps", r.collisions > 0) +
      tile(r.outcome || "–", "outcome", r.outcome && r.outcome !== "pass");
    const acts = (S.actions || []).slice(-14);
    $("exec").innerHTML = acts.map(a => {
      const args = Object.entries(a.args || {}).filter(([k]) => k !== "speed").map(([k, v]) => `${k} ${fmt(v)}`).join(" ");
      const res = a.result && typeof a.result === "object" ? Object.entries(a.result).filter(([k]) => k !== "interrupted").map(([k, v]) => `${k} ${fmt(v)}`).join(" ") : esc(a.result);
      const p = a.pose_after || {};
      return `<div class="${a.collided ? "bump" : ""}"><span class="t">#${esc(String(a.task_id).slice(-3))}</span><span class="tool">${esc(a.tool).toUpperCase()}${a.collided ? " ✕" : ""}</span>` +
        `<em>${esc(args)} → ${res} · (${(p.x ?? 0).toFixed(2)}, ${(p.y ?? 0).toFixed(2)}) ${(p.heading ?? 0).toFixed(0)}°</em></div>`;
    }).join("") || `<div><span class="t">–</span><span></span><em>no actions yet</em></div>`;
  }
}
async function loop() {
  try { [S, M] = await Promise.all([fetch("/admin/status").then(r => r.json()), fetch("/admin/map").then(r => r.json())]); drawMap(); panels(); } catch {}
  setTimeout(loop, 700);
}
loop();

/* ---------- runs ---------- */
async function runs() {
  try {
    const d = await (await fetch("/admin/runs")).json();
    $("rundir").textContent = `${d.runs.length} recorded`;
    $("runs").innerHTML = d.runs.slice(0, 20).map(r => `<div><em title="${esc(r.command)}">${esc(r.command || r.run_id)}</em>` +
      r.videos.map(v => `<button class="btn" data-run="${esc(r.run_id)}" data-v="${esc(v)}" data-c="${esc(r.command)}">${v.includes("clip20") ? "20 S" : "VIDEO"}</button>`).join("") + `</div>`).join("")
      || "<div><em>no runs yet</em></div>";
    document.querySelectorAll("#runs [data-v]").forEach(b => b.onclick = () => {
      $("mtitle").textContent = (b.dataset.c || "VIDEO").toUpperCase().slice(0, 64); $("modal").hidden = false;
      $("player").src = `/admin/runs/${b.dataset.run}/${b.dataset.v}`; $("player").play();
    });
  } catch {}
  setTimeout(runs, 4000);
}
runs();
$("mclose").onclick = () => { $("player").pause(); $("modal").hidden = true; };
addEventListener("keydown", e => { if (e.key === "Escape") $("mclose").onclick(); });
</script>
</body>
</html>
